! Cisco Packet Tracer Initial Switch Configuration (Trunk Allowed VLAN 20 Missing)
! Copy and paste into Switch1 CLI in Cisco Packet Tracer

enable
configure terminal
hostname Switch1

vlan 10
 name Students

vlan 20
 name Faculty

vlan 30
 name Administration

interface FastEthernet0/10
 switchport mode access
 switchport access vlan 10
 no shutdown

interface FastEthernet0/20
 switchport mode access
 switchport access vlan 20
 no shutdown

interface FastEthernet0/30
 switchport mode access
 switchport access vlan 30
 no shutdown

interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,30
 no shutdown

exit
write memory
